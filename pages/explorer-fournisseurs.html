<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explorer les fournisseurs · ALGevent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { background: #f6f9fc; }
    .container { max-width: 1280px; width: 100%; margin: 0 auto; padding: 24px; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 24px; color: #7c3aed; font-weight: 600; }
    .category-header { background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%); border-radius: 24px; padding: 28px 36px; color:white; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; box-shadow:0 12px 30px rgba(124,58,237,0.25); margin-bottom:32px; }
    .category-header h1 { margin:0; font-size:28px; }
    .badge { background: rgba(255,255,255,0.2); border-radius:40px; padding:8px 20px; font-size:14px; font-weight:600; }
    .filter-bar { background:white; border:1px solid #eef2f6; border-radius:60px; padding:16px 24px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; margin-bottom:32px; }
    .filter-label { font-weight:600; color:#1e293b; display:flex; align-items:center; gap:6px; }
    .category-btn { background:#f8fafc; border:1.5px solid #e2e8f0; padding:6px 18px; border-radius:40px; font-size:14px; font-weight:500; color:#475569; cursor:pointer; }
    .category-btn.active { background:#7c3aed; border-color:#7c3aed; color:white; }
    .results-header { margin-bottom:20px; }
    .results-count { font-size:14px; color:#64748b; font-weight:500; }
    .results-count strong { color:#0f172a; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:26px; }
    .card { background:white; border-radius:24px; padding:20px; box-shadow:0 4px 16px rgba(0,0,0,0.04); border:1px solid #edf2f7; }
    .card-image { width:100%; height:160px; background:linear-gradient(145deg,#f1f5f9,#e2e8f0); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:52px; margin-bottom:14px; }
    .card-category { display:inline-block; background:#ede9fe; color:#5b21b6; font-size:11px; font-weight:700; padding:4px 14px; border-radius:20px; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
    .card-title { font-size:19px; font-weight:700; color:#0f172a; margin-bottom:4px; }
    .card-location { font-size:14px; color:#64748b; margin-bottom:8px; }
    .stars { color:#fbbf24; letter-spacing:1px; }
    .card-price { font-size:16px; font-weight:700; color:#7c3aed; margin-top:10px; }
    .card-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .card-tags span { background:#f1f5f9; color:#475569; font-size:11px; padding:2px 12px; border-radius:20px; }
    .no-results { grid-column:1 / -1; text-align:center; padding:60px 20px; color:#94a3b8; }
    @media (max-width:768px) { .category-header { text-align:center; justify-content:center; } .filter-bar { justify-content:center; border-radius:24px; } }
  </style>
</head>
<body>
  <div class="container">
    <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour à l'accueil</a>

    <div class="category-header">
      <div>
        <h1><i class="fas fa-handshake"></i> Fournisseurs d'événements</h1>
        <div style="font-size:16px; opacity:0.85;">Trouvez les meilleurs prestataires pour votre événement</div>
      </div>
      <div class="badge"><i class="fas fa-star"></i> 6 catégories de services</div>
    </div>

    <div class="filter-bar">
      <span class="filter-label"><i class="fas fa-filter"></i> Catégorie :</span>
      <button class="category-btn active" data-category="all">Tous <span class="count">18</span></button>
      <button class="category-btn" data-category="chef-traiteur">Chef &amp; Traiteur <span class="count">4</span></button>
      <button class="category-btn" data-category="serveurs-service">Serveurs &amp; Service <span class="count">2</span></button>
      <button class="category-btn" data-category="dj-artiste">DJ &amp; Artiste <span class="count">3</span></button>
      <button class="category-btn" data-category="decoration">Décoration <span class="count">3</span></button>
      <button class="category-btn" data-category="audiovisuel">Matériel Audiovisuel <span class="count">3</span></button>
      <button class="category-btn" data-category="location-voiture">Location de voiture <span class="count">3</span></button>
    </div>

    <div class="results-header">
      <div class="results-count" id="resultsCount">Affichage de <strong id="countDisplay">18</strong> fournisseurs <span id="categoryDisplay"></span></div>
    </div>

    <div class="grid" id="cardGrid"></div>
  </div>

  <script>
    const fournisseurs = [
      { id: 1, nom: 'Chef Mohamed Amine', categorie: 'chef-traiteur', wilaya: 'Alger', note: 4.9, avis: 156, emoji: '👨‍🍳', prix: 'À partir de 25 000 DA', tags: ['Cuisine orientale', 'Fusion', 'Menu dégustation'] },
      { id: 2, nom: 'Traiteur El Djazair', categorie: 'chef-traiteur', wilaya: 'Alger', note: 4.8, avis: 132, emoji: '🍽️', prix: 'À partir de 20 000 DA', tags: ['Cuisine algérienne', 'Pâtisserie', 'Service à table'] },
      { id: 3, nom: 'Chef Samir', categorie: 'chef-traiteur', wilaya: 'Oran', note: 4.7, avis: 98, emoji: '👨‍🍳', prix: 'À partir de 22 000 DA', tags: ['Cuisine méditerranéenne', 'Poissons', 'Plancha'] },
      { id: 4, nom: 'Traiteur Le Gourmet', categorie: 'chef-traiteur', wilaya: 'Constantine', note: 4.6, avis: 87, emoji: '🍷', prix: 'À partir de 28 000 DA', tags: ['Cuisine française', 'Vins', 'Fromages'] },
      { id: 5, nom: 'Service Prestige', categorie: 'serveurs-service', wilaya: 'Alger', note: 4.7, avis: 112, emoji: '🤵', prix: 'À partir de 15 000 DA', tags: ['Service à table', 'Majordome', 'Tenue de cérémonie'] },
      { id: 6, nom: 'Équipe El Bahia', categorie: 'serveurs-service', wilaya: 'Oran', note: 4.6, avis: 76, emoji: '👔', prix: 'À partir de 12 000 DA', tags: ['Personnel qualifié', 'Service buffet', 'Dressage'] },
      { id: 7, nom: 'DJ Kader Mix', categorie: 'dj-artiste', wilaya: 'Alger', note: 4.9, avis: 203, emoji: '🎧', prix: 'À partir de 30 000 DA', tags: ['House', 'Tech', 'Mariage'] },
      { id: 8, nom: 'DJ Chawki', categorie: 'dj-artiste', wilaya: 'Oran', note: 4.8, avis: 167, emoji: '🎵', prix: 'À partir de 25 000 DA', tags: ['Raï', 'Oriental', 'Mix'] },
      { id: 9, nom: 'Groupe El Anka', categorie: 'dj-artiste', wilaya: 'Constantine', note: 4.7, avis: 89, emoji: '🎶', prix: 'À partir de 35 000 DA', tags: ['Musique andalouse', 'Groupe', 'Traditionnel'] },
      { id: 10, nom: 'Décoration Elégance', categorie: 'decoration', wilaya: 'Alger', note: 4.9, avis: 178, emoji: '💐', prix: 'À partir de 18 000 DA', tags: ['Fleurs', 'Lumière', 'Mobilier'] },
      { id: 11, nom: 'Décoration Oran', categorie: 'decoration', wilaya: 'Oran', note: 4.6, avis: 94, emoji: '🎨', prix: 'À partir de 15 000 DA', tags: ['Scénographie', 'Ballons', 'Rideaux'] },
      { id: 12, nom: 'Dream Déco', categorie: 'decoration', wilaya: 'Blida', note: 4.5, avis: 67, emoji: '✨', prix: 'À partir de 20 000 DA', tags: ['Thème personnalisé', 'Mariage', 'Anniversaire'] },
      { id: 13, nom: 'AV PRO', categorie: 'audiovisuel', wilaya: 'Alger', note: 4.8, avis: 145, emoji: '📹', prix: 'À partir de 22 000 DA', tags: ['Sonorisation', 'Éclairage', 'Écrans LED'] },
      { id: 14, nom: 'Studio Lumière', categorie: 'audiovisuel', wilaya: 'Constantine', note: 4.7, avis: 88, emoji: '💡', prix: 'À partir de 20 000 DA', tags: ['Projection', 'Photographie', 'Vidéo'] },
      { id: 15, nom: 'Sound System', categorie: 'audiovisuel', wilaya: 'Oran', note: 4.6, avis: 73, emoji: '🔊', prix: 'À partir de 18 000 DA', tags: ['Sonorisation', 'Micros', 'Enceintes'] },
      { id: 16, nom: 'Elite Cars', categorie: 'location-voiture', wilaya: 'Alger', note: 4.7, avis: 156, emoji: '🚗', prix: 'À partir de 30 000 DA', tags: ['Berlines', 'SUV', 'Chauffeur'] },
      { id: 17, nom: 'Prestige Auto', categorie: 'location-voiture', wilaya: 'Oran', note: 4.6, avis: 89, emoji: '🚙', prix: 'À partir de 25 000 DA', tags: ['Sportives', 'Cérémonie', 'Cortège'] },
      { id: 18, nom: 'Dream Drive', categorie: 'location-voiture', wilaya: 'Annaba', note: 4.5, avis: 56, emoji: '🚘', prix: 'À partir de 22 000 DA', tags: ['Voitures de luxe', 'Chauffeur privé'] }
    ];

    function getStars(note) {
      const full = Math.floor(note);
      const half = (note - full) >= 0.5 ? 1 : 0;
      const empty = 5 - full - half;
      return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
    }

    function getCategoryLabel(categorie) {
      const labels = {
        'chef-traiteur': 'Chef & Traiteur',
        'serveurs-service': 'Serveurs & Service',
        'dj-artiste': 'DJ & Artiste',
        decoration: 'Décoration',
        audiovisuel: 'Matériel Audiovisuel',
        'location-voiture': 'Location de voiture'
      };
      return labels[categorie] || categorie;
    }

    function renderCards(category = 'all') {
      const countDisplay = document.getElementById('countDisplay');
      const categoryDisplay = document.getElementById('categoryDisplay');
      const grid = document.getElementById('cardGrid');

      let filtered = category === 'all' ? fournisseurs : fournisseurs.filter(f => f.categorie === category);
      filtered = [...filtered].sort((a, b) => b.note - a.note);

      countDisplay.textContent = filtered.length;
      categoryDisplay.textContent = category === 'all' ? '' : `· ${getCategoryLabel(category)}`;

      if (!filtered.length) {
        grid.innerHTML = '<div class="no-results"><i class="fas fa-search"></i><h3>Aucun fournisseur trouvé</h3><p>Essayez une autre catégorie ou revenez plus tard.</p></div>';
        return;
      }

      grid.innerHTML = filtered.map((f, index) => `
        <div class="card" style="animation-delay:${index * 0.05}s;">
          <div class="card-image"><span>${f.emoji}</span></div>
          <div class="card-category"><i class="fas fa-tag"></i> ${getCategoryLabel(f.categorie)}</div>
          <div class="card-title">${f.nom}</div>
          <div class="card-location"><i class="fas fa-location-dot"></i> ${f.wilaya}</div>
          <div style="color:#fbbf24; font-size:14px; margin-bottom:6px;">
            <span class="stars">${getStars(f.note)}</span>
            <span style="color:#0f172a; font-weight:700;">${f.note.toFixed(1)}</span>
            <span style="color:#94a3b8;">(${f.avis} avis)</span>
          </div>
          <div class="card-tags">${f.tags.map(tag => `<span>#${tag}</span>`).join('')}</div>
          <div class="card-price">💰 ${f.prix}</div>
        </div>
      `).join('');
    }

    document.querySelectorAll('.category-btn').forEach((btn) => {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.category-btn').forEach((b) => b.classList.remove('active'));
        this.classList.add('active');
        renderCards(this.dataset.category);
      });
    });

    renderCards('all');
  </script>
</body>
</html>
