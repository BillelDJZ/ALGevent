<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau de bord · ALGevent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body {
      margin: 0;
      background: #f2f4f8;
      font-family: 'Inter', sans-serif;
      color: #1a1a2e;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: white;
      border-radius: 24px;
      padding: 20px 24px;
      box-shadow: 0 12px 28px rgba(0, 20, 40, 0.06);
      margin-bottom: 28px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0;
      font-size: 28px;
      font-weight: 800;
      text-decoration: none;
      color: #1a1a2e;
    }
    .alg-wrapper {
      display: inline-flex;
      background: #1a1a2e;
      padding: 2px 6px;
      border-radius: 6px;
      gap: 1px;
    }
    .a { color: #31a24c; }
    .l { color: #dc2626; }
    .g { color: #fff; }
    .event { margin-left: 4px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
    }
    .btn.primary { background: #4a6cf7; color: white; }
    .btn.secondary { background: #eef2ff; color: #1f2a44; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06);
    }
    .card h3 {
      margin: 0 0 12px;
      font-size: 1.1rem;
    }
    .metric {
      font-size: 2rem;
      font-weight: 800;
      margin: 0 0 6px;
      color: #4a6cf7;
    }
    .muted { color: #64748b; }
    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="../index.html" class="logo" aria-label="ALGevent logo">
        <span class="alg-wrapper">
          <span class="a">A</span>
          <span class="l">L</span>
          <span class="g">G</span>
        </span>
        <span class="event">event</span>
      </a>
      <div class="actions">
        <a href="explorer-salles.html" class="btn secondary"><i class="fas fa-building"></i> Salles</a>
        <a href="explorer-fournisseurs.html" class="btn secondary"><i class="fas fa-handshake"></i> Fournisseurs</a>
        <a href="../index.html" class="btn primary"><i class="fas fa-house"></i> Accueil</a>
      </div>
    </header>

    <div class="card">
      <h3>Bienvenue dans votre espace client</h3>
      <p class="muted">Cette page sert de tableau de bord temporaire pendant que le site est en mode statique.</p>
    </div>

    <div class="grid">
      <div class="card">
        <div class="metric">12</div>
        <div class="muted">Demandes reçues</div>
      </div>
      <div class="card">
        <div class="metric">8</div>
        <div class="muted">Favoris sauvegardés</div>
      </div>
      <div class="card">
        <div class="metric">4</div>
        <div class="muted">Réservations validées</div>
      </div>
      <div class="card">
        <div class="metric">96%</div>
        <div class="muted">Satisfaction</div>
      </div>
    </div>
  </div>
</body>
</html>
