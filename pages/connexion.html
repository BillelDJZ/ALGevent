<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion · ALGevent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="center-wrap">
    <header>
      <div class="logo">
        <span class="a">A</span><span class="l">L</span><span class="g">G</span><span class="event">event</span>
      </div>
      <div class="header-actions">
        <a href="../index.html" class="login">Retour</a>
      </div>
    </header>

    <main class="auth-shell">
      <div class="auth-box">
        <div class="auth-head">
          <span class="eyebrow">Authentification</span>
          <h1>Se connecter</h1>
          <p class="sub">Connectez-vous à votre compte ALGevent.</p>
        </div>

        <form id="login-form">
          <div class="field">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" placeholder="vous@exemple.com" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
        </form>

        <div class="field-hint" style="text-align:center;margin-top:22px;">
          <a href="forgot-password.html">Mot de passe oublié ?</a>
        </div>

        <div style="text-align:center;margin-top:24px;padding-top:18px;border-top:1px solid #e4e6eb;font-size:0.9rem;color:#65676b;">
          Pas encore inscrit ? <a href="signup.html" style="color:#1877f2;font-weight:600;">Créer un compte</a>
        </div>
      </div>
    </main>

    <footer class="foot">
      <div class="wrap" style="display:flex;justify-content:space-between;">
        <span class="mono">ALGEVENT — © 2026</span>
        <span class="mono">Connexion sécurisée</span>
      </div>
    </footer>
  </div>
  <script src="../js/script.js"></script>
</body>
</html>
